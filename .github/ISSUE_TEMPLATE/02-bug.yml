name: 버그
description: 기대와 다르게 동작하는 것을 알립니다
title: "fix: "
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: 무슨 일이 일어났나
      description: 기대한 것과 실제로 일어난 것
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: 다시 일으키는 방법
      description: 명령, 입력, 순서
      render: shell
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: 환경
      placeholder: "커밋 abc1234, 라즈베리파이 3B+ / 노트북 Ubuntu / 폰 기종"
  - type: textarea
    id: log
    attributes:
      label: 기록·화면
      render: shell
